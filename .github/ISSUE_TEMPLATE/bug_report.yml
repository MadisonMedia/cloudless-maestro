name: Bug report
description: Something does not work as described
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For example which time of day applied when, and which one you expected.
    validations:
      required: true
  - type: input
    id: maestro
    attributes:
      label: Maestro version
      placeholder: 0.1.0b1
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Home Assistant version
      placeholder: 2026.11.0
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: The list from the Diagnostics tab on the Maestro page helps a lot.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      render: text
